<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoAI — Journal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="scroll-shell">

    <header class="header">
        <a href="../index.html" class="logo">Emo<strong>AI</strong></a>
        <nav class="nav">
            <a href="../index.html" class="nav-link">Chat</a>
            <a href="journal.html" class="nav-link active">Journal</a>
        </nav>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </header>

    <div class="disclaimer">
        ⚠️ EmoAI is not a substitute for professional mental health support.
        In a crisis, call <a href="tel:9152987821">iCall: 9152987821</a>
    </div>

    <div class="journal-layout">

        <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                <h2 style="font-size:18px">Today's entry</h2>
                <span id="today-date" style="font-size:12px;color:var(--muted)"></span>
            </div>
            <textarea id="journal-input" class="journal-textarea"
                placeholder="Write freely. This is your private space — no judgment, no audience. What's on your mind today?"
                maxlength="5000"></textarea>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
                <span id="word-count" style="font-size:12px;color:var(--muted)">0 words</span>
                <button id="reflect-btn" class="btn btn-primary" disabled>Reflect</button>
            </div>
        </div>

        <div id="reflection-card" class="reflection-card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <div class="reflection-label">EmoAI reflection</div>
                <span id="reflection-emotion" style="font-size:12px"></span>
            </div>
            <p id="reflection-text" class="reflection-text"></p>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
                <a href="https://forms.gle/REPLACE_WITH_YOUR_GOOGLE_FORM_LINK" target="_blank" rel="noopener"
                    style="font-size:12px;color:var(--accent);text-decoration:underline">
                    📝 Share feedback about EmoAI →
                </a>
            </div>
        </div>

        <div>
            <h2 style="font-size:16px;margin-bottom:12px">Past entries</h2>
            <div id="journal-history">
                <p style="font-size:13px;color:var(--muted)">Your past entries will appear here.</p>
            </div>
        </div>

    </div>

    <script>
        document.getElementById("today-date").textContent = new Date().toLocaleDateString("en-IN", {
            weekday: "long", day: "numeric", month: "long"
        });
    </script>
    <script type="module" src="../js/journal.js"></script>
</body>

</html>
